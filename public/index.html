<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus coding survey</title>
  <style>
    :root { --paper:#f4f6f8; --ink:#1b2a41; --accent:#0d7a6b; --line:#d3dbe3; --error:#b3261e; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink);
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height:1.5; }
    .wrap { max-width: 52rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    h1 { font-size: 2rem; margin: 0 0 .25rem; }
    .sub { margin: 0 0 2rem; color:#4a5a70; }
    form { background:#fff; border:1px solid var(--line); border-radius:8px; padding:1.25rem;
           display:grid; gap:1rem; }
    label { display:grid; gap:.3rem; font-weight:600; font-size:.95rem; }
    input, select, textarea { font:inherit; padding:.6rem .7rem; border:1px solid var(--line);
                              border-radius:6px; background:#fff; color:inherit; }
    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible
      { outline:3px solid #7cc9bd; outline-offset:1px; }
    button { font:inherit; font-weight:600; background:var(--accent); color:#fff; border:0;
             padding:.75rem 1.25rem; border-radius:6px; cursor:pointer; justify-self:start; }
    button:disabled { opacity:.6; cursor:wait; }
    #msg { min-height:1.4em; margin:0; font-size:.95rem; }
    #msg.error { color:var(--error); }
    #msg.ok { color:var(--accent); }
    h2 { margin:2.5rem 0 .75rem; font-size:1.3rem; }
    .table-scroll { overflow-x:auto; background:#fff; border:1px solid var(--line); border-radius:8px; }
    table { border-collapse:collapse; width:100%; min-width:36rem; }
    th, td { text-align:left; padding:.65rem .8rem; border-bottom:1px solid var(--line); vertical-align:top; }
    th { background:#eaeff4; font-size:.9rem; }
    tr:last-child td { border-bottom:0; }
    .empty { padding:1rem; color:#4a5a70; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Campus coding survey</h1>
    <p class="sub">Answer four quick questions. Your response appears in the table below after you save.</p>

    <form id="survey-form">
      <label>Your name
        <input type="text" id="name" maxlength="60" required>
      </label>
      <label>Favourite programming language
        <select id="language" required>
          <option value="">Choose one</option>
          <option>Python</option>
          <option>C</option>
          <option>Java</option>
          <option>JavaScript</option>
          <option>Other</option>
        </select>
      </label>
      <label>How much do you enjoy coding? (1 = not much, 5 = a lot)
        <select id="rating" required>
          <option value="">Choose 1 to 5</option>
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
        </select>
      </label>
      <label>Comment (optional)
        <textarea id="comment" rows="3" maxlength="300"></textarea>
      </label>
      <button type="submit" id="save-btn">Save response</button>
      <p id="msg" role="status"></p>
    </form>

    <h2>All responses</h2>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>#</th><th>Name</th><th>Language</th><th>Rating</th><th>Comment</th><th>Saved on</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty" id="empty" hidden>No responses yet. Be the first to save one.</p>
    </div>
  </div>

  <script>
    const form = document.getElementById("survey-form");
    const rowsEl = document.getElementById("rows");
    const emptyEl = document.getElementById("empty");
    const msgEl = document.getElementById("msg");
    const saveBtn = document.getElementById("save-btn");

    function showMsg(text, type) {
      msgEl.textContent = text;
      msgEl.className = type || "";
    }

    function cell(text) {
      const td = document.createElement("td");
      td.textContent = text;          // textContent keeps user input safe from HTML injection
      return td;
    }

    async function loadResponses() {
      try {
        const res = await fetch("/api/responses");
        if (!res.ok) throw new Error("Server returned " + res.status);
        const data = await res.json();
        rowsEl.innerHTML = "";
        emptyEl.hidden = data.length > 0;
        data.forEach((r) => {
          const tr = document.createElement("tr");
          [r.id, r.name, r.language, r.rating, r.comment, r.created_at].forEach((v) =>
            tr.appendChild(cell(v))
          );
          rowsEl.appendChild(tr);
        });
      } catch (err) {
        showMsg("Could not load responses. Check Vercel logs for /api/responses.", "error");
        console.error(err);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      saveBtn.disabled = true;
      showMsg("Saving...");
      try {
        const res = await fetch("/api/responses", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value,
            language: document.getElementById("language").value,
            rating: document.getElementById("rating").value,
            comment: document.getElementById("comment").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Save failed");
        form.reset();
        showMsg("Saved. Thank you!", "ok");
        await loadResponses();
      } catch (err) {
        showMsg(err.message, "error");
      } finally {
        saveBtn.disabled = false;
      }
    });

    loadResponses();
  </script>
</body>
</html>
